<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DR.Simple_UI social preview</title>
  <desc id="desc">Social card for the DR.Simple_UI shared Blazor design system.</desc>
  <defs>
    <radialGradient id="halo" cx="20%" cy="20%" r="85%">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#111827"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <g transform="translate(74 86) scale(0.46)">
    
  <title id="title">DR.Simple_UI icon</title>
  <desc id="desc">A minimal application frame with a blue sidebar and reusable interface modules.</desc>
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="240" y1="220" x2="790" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <rect x="84" y="84" width="856" height="856" rx="204" fill="none" stroke="#374151" stroke-width="18"/>

  <g filter="url(#shadow)">
    <rect x="188" y="202" width="648" height="620" rx="78" fill="#F3F4F6"/>
    <path d="M188 356H836" stroke="#D1D5DB" stroke-width="34"/>
    <path d="M356 356V822" stroke="#D1D5DB" stroke-width="34"/>

    <!-- Brand sidebar -->
    <path d="M188 280C188 236.9 222.9 202 266 202H356V822H266C222.9 822 188 787.1 188 744V280Z" fill="url(#brand)"/>

    <!-- Window controls -->
    <circle cx="432" cy="279" r="22" fill="#2563EB"/>
    <circle cx="504" cy="279" r="22" fill="#60A5FA"/>
    <circle cx="576" cy="279" r="22" fill="#93C5FD"/>

    <!-- Sidebar navigation -->
    <rect x="236" y="412" width="72" height="72" rx="24" fill="#F3F4F6" fill-opacity="0.98"/>
    <rect x="236" y="520" width="72" height="20" rx="10" fill="#F3F4F6" fill-opacity="0.58"/>
    <rect x="236" y="580" width="72" height="20" rx="10" fill="#F3F4F6" fill-opacity="0.58"/>
    <rect x="236" y="640" width="72" height="20" rx="10" fill="#F3F4F6" fill-opacity="0.58"/>

    <!-- Semantic content modules -->
    <rect x="412" y="414" width="354" height="112" rx="34" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="22"/>
    <rect x="412" y="574" width="152" height="170" rx="34" fill="#2563EB"/>
    <rect x="614" y="574" width="152" height="170" rx="34" fill="#60A5FA" fill-opacity="0.28" stroke="#60A5FA" stroke-width="20"/>

    <!-- Token dots: one contract feeding the modules -->
    <circle cx="448" cy="470" r="19" fill="#2563EB"/>
    <rect x="490" y="451" width="214" height="38" rx="19" fill="#2563EB" fill-opacity="0.72"/>
  </g>

  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="572" y="270" font-size="94" font-weight="750" letter-spacing="-4">
      <tspan fill="#60A5FA">DR.</tspan><tspan fill="#F3F4F6">Simple_UI</tspan>
    </text>
    <text x="579" y="349" font-size="34" font-weight="500" fill="#D1D5DB">
      One design-token contract.
    </text>
    <text x="579" y="397" font-size="34" font-weight="500" fill="#D1D5DB">
      Semantic CSS. Consistent Blazor apps.
    </text>
    <rect x="579" y="445" width="420" height="6" rx="3" fill="#2563EB"/>
  </g>
</svg>
