# Dependency updates.
#
# Two ecosystems only, because the library itself has exactly one package reference
# (Microsoft.AspNetCore.Components.Web) and ships no vendored dependency Dependabot
# could see: Remix Icon is updated by build/vendor-remixicon.sh, which pins the
# version and re-trims the CSS, so an automated bump would produce output the
# vendoring script's guards would reject.
#
# TreatWarningsAsErrors turns NU1902 (a package with a known vulnerability) into a
# build failure, so a vulnerable transitive dependency already fails CI rather than
# waiting for a Dependabot alert. That is how bUnit 1.x's AngleSharp 1.2.0 was caught.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # The test-only packages move together and are verified by the suite itself, so
      # one PR rather than four.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "bunit"
          - "Microsoft.Playwright"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "ci"
